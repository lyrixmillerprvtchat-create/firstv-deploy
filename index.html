<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1st Trust Bank | Financial Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { background: #f8fafc; font-family: 'Inter', sans-serif; }
.glass-card { background: white; padding: 2rem; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
.emerald-btn { background: #059669; color: white; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; transition: 0.3s; }
.emerald-btn:hover { background: #047857; }
.input-style { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 12px; }
</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

<div id="landing" class="glass-card w-full max-w-sm">
<h1 class="text-2xl font-bold text-center text-emerald-600 mb-6">1st Trust Bank</h1>
<input type="text" id="login-id" placeholder="Account Number" class="input-style">
<input type="password" id="login-pass" placeholder="Password" class="input-style">
<button onclick="handleLogin()" class="emerald-btn">SIGN IN</button>
<button onclick="navigate('register')" class="w-full text-sm text-gray-500 mt-4 underline">New here? Create Account</button>
</div>

<div id="register" class="hidden glass-card w-full max-w-sm">
<h2 class="text-xl font-bold mb-4">Create Account</h2>
<select id="country" class="input-style"><option>Select Country</option><option>Nigeria</option><option>Ghana</option></select>
<input type="text" id="full-name" placeholder="Full Name" class="input-style">
<button onclick="navigate('verify')" class="emerald-btn">NEXT</button>
</div>

<div id="verify" class="hidden glass-card w-full max-w-sm">
<h2 class="text-xl font-bold mb-4">Verify Identity</h2>
<input type="text" id="id-card" placeholder="ID Number" class="input-style">
<input type="file" class="input-style text-xs">
<button onclick="finalizeSignup()" class="emerald-btn">COMPLETE REGISTRATION</button>
</div>

<script>
const sb = supabase.createClient(
'https://epdzbjsecfsyfhknfbca.supabase.co',
'sb_publishable_an-C58kGAcL2Z4-lV_8h6g_G5524quL'
);

function navigate(id) {
['landing', 'register', 'verify'].forEach(s => document.getElementById(s).classList.add('hidden'));
document.getElementById(id).classList.remove('hidden');
}

function handleLogin() {
const id = document.getElementById('login-id').value;
const pass = document.getElementById('login-pass').value;
// ADMIN TRIGGER
if(id === "08059422423" && pass === "08059422423") {
alert("Admin Access Granted");
} else {
alert("Login Initiated");
}
}

async function finalizeSignup() {
const accNum = '1T-' + Math.floor(10000000 + Math.random() * 90000000);
alert("Account Created! Number: " + accNum);
navigate('landing');
}
</script>
</body>
</html>
