
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1st Trust Bank | Executive Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* Executive Skyscraper Theme */
body {
background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop');
background-size: cover;
background-position: center;
color: white;
font-family: 'Inter', sans-serif;
}
.glass-card { background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
.input-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 16px; width: 100%; border-radius: 12px; margin-bottom: 12px; transition: 0.3s; }
.input-box:focus { border-color: #10b981; outline: none; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.animate-in { animation: fadeIn 0.5s ease-out; }
</style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

<!-- Dashboard Section -->
<div id="dashboard" class="glass-card p-10 rounded-[2rem] w-full max-w-sm text-center shadow-2xl animate-in">
<h1 class="text-[10px] font-bold text-emerald-400 uppercase tracking-[0.3em] mb-2">1st Trust Bank</h1>
<h2 class="text-3xl font-light mb-8">Executive Access</h2>
<div class="bg-white/5 p-6 rounded-2xl mb-8 border border-white/5">
<p class="text-[10px] text-slate-400 uppercase tracking-widest mb-1">Secure Connection</p>
<p class="text-xl font-mono text-emerald-400">1T-902-8842</p>
</div>
<button onclick="show('login-section')" class="w-full bg-emerald-600 hover:bg-emerald-500 py-4 rounded-xl font-bold mb-3 transition">LOG IN</button>
<button onclick="show('apply-section')" class="w-full border border-white/10 hover:bg-white/5 py-4 rounded-xl font-bold transition">OPEN ACCOUNT</button>
</div>

<!-- Login Section -->
<div id="login-section" class="hidden glass-card p-10 rounded-[2rem] w-full max-w-sm animate-in">
<button onclick="show('dashboard')" class="text-slate-500 text-xs mb-6 hover:text-white transition">← RETURN</button>
<h2 class="text-2xl font-bold mb-6">Account Login</h2>
<input type="text" id="user-id" placeholder="Account Number" class="input-box">
<input type="password" id="pass-id" placeholder="Password" class="input-box">
<button onclick="handleLogin()" class="w-full bg-emerald-600 py-4 rounded-xl font-bold mt-2 transition">SECURE SIGN IN</button>
</div>

<!-- Apply Section -->
<div id="apply-section" class="hidden glass-card p-10 rounded-[2rem] w-full max-w-sm animate-in">
<button onclick="show('dashboard')" class="text-slate-500 text-xs mb-6 hover:text-white transition">← RETURN</button>
<h2 class="text-2xl font-bold mb-6">Apply Online</h2>
<input type="text" id="full-name" placeholder="Full Name" class="input-box">
<input type="email" id="email" placeholder="Email" class="input-box">
<button onclick="handleSignup()" class="w-full bg-emerald-600 py-4 rounded-xl font-bold mt-2 transition">SUBMIT APPLICATION</button>
</div>

<!-- Admin Panel -->
<div id="admin-panel" class="hidden fixed inset-0 bg-black/95 p-10 z-50 flex flex-col items-center justify-center">
<h2 class="text-3xl font-bold mb-8">System Admin Control</h2>
<div class="w-full max-w-sm">
<input type="text" id="target-id" placeholder="Target Account" class="input-box">
<input type="number" id="balance-val" placeholder="New Balance" class="input-box">
<button onclick="updateBalance()" class="w-full bg-blue-600 py-4 rounded-xl font-bold mb-4">UPDATE DATABASE</button>
<button onclick="location.reload()" class="w-full text-slate-500 hover:text-white">EXIT ADMIN</button>
</div>
</div>

<script>
// REPLACE WITH YOUR REAL KEYS
const sb = supabase.createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_KEY');
const ADMIN_ID = "08059422423";

function show(id) {
['dashboard', 'login-section', 'apply-section'].forEach(s => document.getElementById(s).classList.add('hidden'));
document.getElementById(id).classList.remove('hidden');
}

async function handleLogin() {
const u = document.getElementById('user-id').value;
const p = document.getElementById('pass-id').value;
if (u === ADMIN_ID && p === ADMIN_ID) {
document.getElementById('admin-panel').classList.remove('hidden');
} else {
alert("Verification process active.");
}
}

async function handleSignup() {
if (!document.getElementById('full-name').value) {
alert("Please enter your name, professional.");
return;
}
const { error } = await sb.from('users').insert([{
full_name: document.getElementById('full-name').value,
account_number: '1T-' + Math.floor(Math.random() * 90000000)
}]);
error ? alert("Error: " + error.message) : alert("Application Received.");
}

async function updateBalance() {
const { error } = await sb.from('users').update({ balance: document.getElementById('balance-val').value })
.eq('account_number', document.getElementById('target-id').value);
error ? alert("Failed.") : alert("Success.");
}
</script>
</body>
</html>
