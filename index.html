<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>1st Trust Bank | Executive Banking</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0f1e 0%, #0a0c15 100%);
      position: relative;
      overflow-x: hidden;
    }

    /* Skyscraper parallax background */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070');
      background-size: cover;
      background-position: center 30%;
      opacity: 0.15;
      z-index: 0;
      filter: brightness(0.7);
    }

    /* Glass morphism container */
    .glass-container {
      position: relative;
      z-index: 2;
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      backdrop-filter: blur(20px);
      background: rgba(10, 14, 23, 0.65);
      border-radius: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Navigation */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
      margin-bottom: 2rem;
    }

    .logo h1 {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #FFFFFF 0%, #D4AF37 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }

    .logo p {
      font-size: 0.75rem;
      color: rgba(255, 215, 0, 0.7);
      letter-spacing: 2px;
    }

    /* Step indicators */
    .steps {
      display: flex;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .step {
      flex: 1;
      padding: 0.75rem;
      text-align: center;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 1rem;
      color: #94a3b8;
      transition: all 0.3s ease;
    }

    .step.active {
      background: rgba(212, 175, 55, 0.15);
      color: #D4AF37;
      border: 1px solid rgba(212, 175, 55, 0.4);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
    }

    /* Forms */
    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #cbd5e1;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.85rem 1rem;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      color: white;
      font-size: 1rem;
      transition: all 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #D4AF37;
      box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
    }

    button {
      background: linear-gradient(135deg, #D4AF37 0%, #B8942E 100%);
      color: #0a0f1e;
      font-weight: 700;
      padding: 0.9rem 2rem;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(212, 175, 55, 0.4);
    }

    /* Admin Overlay */
    .admin-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(30px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
    }

    .admin-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .admin-card {
      background: rgba(20, 25, 40, 0.95);
      border-radius: 2rem;
      padding: 2.5rem;
      max-width: 500px;
      width: 90%;
      border: 1px solid rgba(212, 175, 55, 0.3);
      box-shadow: 0 25px 50px -12px black;
    }

    /* Dashboard grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .stat-card {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 1.5rem;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .user-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    .user-table th, .user-table td {
      padding: 0.75rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Animations */
    .fade-in {
      animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .error {
      color: #ef4444;
      font-size: 0.875rem;
      margin-top: 0.5rem;
    }

    .success {
      color: #10b981;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="glass-container" id="app">
  <div class="nav-bar">
    <div class="logo">
      <h1>1ST TRUST BANK</h1>
      <p>PRIVATE WEALTH MANAGEMENT</p>
    </div>
    <button id="adminToggleBtn" style="background: rgba(0,0,0,0.6); color: #D4AF37; border: 1px solid #D4AF37;">ADMIN PORTAL</button>
  </div>

  <div id="dynamicContent" class="fade-in">
    <!-- Content injected by JS -->
  </div>
</div>

<!-- Admin Portal Overlay -->
<div id="adminOverlay" class="admin-overlay">
  <div class="admin-card">
    <h2 style="color:#D4AF37; margin-bottom:1rem;">🔐 Executive Admin</h2>
    <div id="adminLoginForm">
      <input type="text" id="adminId" placeholder="Admin ID" style="margin-bottom:1rem;">
      <input type="password" id="adminPassword" placeholder="Password" style="margin-bottom:1.5rem;">
      <button id="adminLoginBtn">Authenticate</button>
      <button id="closeAdminBtn" style="background:transparent; color:white; margin-top:1rem;">Close</button>
    </div>
    <div id="adminPanel" style="display:none;">
      <h3>👑 Admin Dashboard</h3>
      <div id="adminUserList"></div>
      <button id="adminLogoutBtn" style="margin-top:1rem;">Logout</button>
    </div>
  </div>
</div>

<script>
  // Supabase Initialization
  const SUPABASE_URL = 'https://epdzbjsecfsyfhknfbca.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_an-C58kGAcL2Z4-lV_8h6g_G5524quL';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Hardcoded Admin credentials (production: hash & env vars)
  const ADMIN_CREDENTIALS = {
    id: '08059422423',
    password: '08059422423'
  };

  // App State
  let currentStep = 1; // 1=Landing/Reg, 2=Verification, 3=Dashboard
  let tempUserData = {
    step1: {},
    step2: {}
  };
  let authenticatedUser = null;
  let isAdminMode = false;

  // Session persistence
  function saveTempState() {
    sessionStorage.setItem('trustBank_tempUser', JSON.stringify(tempUserData));
    sessionStorage.setItem('trustBank_step', currentStep);
  }

  function loadTempState() {
    const saved = sessionStorage.getItem('trustBank_tempUser');
    const savedStep = sessionStorage.getItem('trustBank_step');
    if (saved) tempUserData = JSON.parse(saved);
    if (savedStep) currentStep = parseInt(savedStep);
  }

  // Navigation with animation
  function navigateToStep(step) {
    currentStep = step;
    saveTempState();
    renderCurrentStep();
  }

  // Generate random account number
  function generateAccountNumber() {
    return 'TRUST' + Math.floor(1000000000 + Math.random() * 9000000000);
  }

  // Step 1: Credentials (Full Name, Email, Phone, Address)
  async function handleStep1Submit(e) {
    e.preventDefault();
    const formData = {
      full_name: document.getElementById('fullName').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      address: document.getElementById('address').value
    };
    if (!formData.full_name || !formData.email || !formData.phone || !formData.address) {
      alert('Please fill all fields');
      return;
    }
    tempUserData.step1 = formData;
    saveTempState();
    navigateToStep(2);
  }

  // Step 2: ID/Work/Salary Verification
  async function handleStep2Submit(e) {
    e.preventDefault();
    const formData = {
      id_card: document.getElementById('idCard').value,
      work: document.getElementById('work').value,
      salary: parseFloat(document.getElementById('salary').value)
    };
    if (!formData.id_card || !formData.work || !formData.salary) {
      alert('Please complete verification');
      return;
    }
    tempUserData.step2 = formData;
    
    // Final registration to Supabase
    const finalUser = {
      full_name: tempUserData.step1.full_name,
      email: tempUserData.step1.email,
      phone: tempUserData.step1.phone,
      address: tempUserData.step1.address,
      id_card: tempUserData.step2.id_card,
      work: tempUserData.step2.work,
      salary: tempUserData.step2.salary,
      account_number: generateAccountNumber(),
      balance: 50000 // welcome bonus
    };

    const { data, error } = await supabase
      .from('users')
      .insert([finalUser])
      .select();

    if (error) {
      alert('Registration failed: ' + error.message);
      return;
    }
    
    authenticatedUser = data[0];
    sessionStorage.removeItem('trustBank_tempUser');
    sessionStorage.removeItem('trustBank_step');
    navigateToStep(3);
  }

  // Dashboard rendering
  function renderDashboard() {
    if (!authenticatedUser) return '<div>Session expired. Please refresh.</div>';
    return `
      <div class="fade-in">
        <h2 style="color:#D4AF37;">Welcome, ${authenticatedUser.full_name}</h2>
        <div class="dashboard-grid">
          <div class="stat-card">
            <h3>💰 Balance</h3>
            <p style="font-size:2rem; color:#D4AF37;">$${authenticatedUser.balance.toLocaleString()}</p>
          </div>
          <div class="stat-card">
            <h3>🏦 Account Number</h3>
            <p>${authenticatedUser.account_number}</p>
          </div>
          <div class="stat-card">
            <h3>💼 Occupation</h3>
            <p>${authenticatedUser.work}</p>
          </div>
        </div>
        <div class="stat-card">
          <h3>📄 Personal Details</h3>
          <p>Email: ${authenticatedUser.email}<br>Phone: ${authenticatedUser.phone}<br>Address: ${authenticatedUser.address}</p>
        </div>
        <button onclick="location.reload()" style="margin-top:2rem;">Logout / New Registration</button>
      </div>
    `;
  }

  // Admin: fetch all users, update balance with audit
  async function loadAdminUsers() {
    const { data, error } = await supabase.from('users').select('*');
    if (error) return alert('Admin fetch error');
    const html = `
      <table class="user-table">
        <thead><tr><th>Name</th><th>Email</th><th>Balance</th><th>Action</th></tr></thead>
        <tbody>
          ${data.map(user => `
            <tr>
              <td>${user.full_name}</td>
              <td>${user.email}</td>
              <td>$${user.balance}</td>
              <td><button onclick="window.adjustBalance('${user.id}', ${user.balance})">Adjust</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    document.getElementById('adminUserList').innerHTML = html;
  }

  window.adjustBalance = async (userId, currentBalance) => {
    const newBalance = prompt('Enter new balance amount:', currentBalance);
    if (newBalance === null) return;
    const delta = parseFloat(newBalance) - currentBalance;
    // Set admin context for trigger
    await supabase.rpc('set_admin_context', { admin_id: ADMIN_CREDENTIALS.id });
    const { error } = await supabase
      .from('users')
      .update({ balance: parseFloat(newBalance) })
      .eq('id', userId);
    if (error) alert('Update failed: ' + error.message);
    else {
      alert(`Balance updated. Delta: ${delta}`);
      loadAdminUsers();
    }
  };

  // Helper RPC (create in Supabase)
  // CREATE OR REPLACE FUNCTION set_admin_context(admin_id text) RETURNS void AS $$ BEGIN PERFORM set_config('app.current_admin', admin_id, false); END; $$ LANGUAGE plpgsql;

  // Render based on step
  async function renderCurrentStep() {
    const container = document.getElementById('dynamicContent');
    if (currentStep === 1) {
      container.innerHTML = `
        <div class="steps"><div class="step active">Step 1: Credentials</div><div class="step">Step 2: Verification</div><div class="step">Dashboard</div></div>
        <form id="step1Form">
          <div class="form-group"><label>Full Name</label><input id="fullName" value="${tempUserData.step1.full_name || ''}" required></div>
          <div class="form-group"><label>Email</label><input id="email" type="email" value="${tempUserData.step1.email || ''}" required></div>
          <div class="form-group"><label>Phone</label><input id="phone" value="${tempUserData.step1.phone || ''}" required></div>
          <div class="form-group"><label>Address</label><textarea id="address">${tempUserData.step1.address || ''}</textarea></div>
          <button type="submit">Continue →</button>
        </form>
      `;
      document.getElementById('step1Form').addEventListener('submit', handleStep1Submit);
    } 
    else if (currentStep === 2) {
      container.innerHTML = `
        <div class="steps"><div class="step">Step 1</div><div class="step active">Step 2: Verification</div><div class="step">Dashboard</div></div>
        <form id="step2Form">
          <div class="form-group"><label>ID Card Number</label><input id="idCard" value="${tempUserData.step2.id_card || ''}" required></div>
          <div class="form-group"><label>Work/Company</label><input id="work" value="${tempUserData.step2.work || ''}" required></div>
          <div class="form-group"><label>Monthly Salary ($)</label><input id="salary" type="number" value="${tempUserData.step2.salary || ''}" required></div>
          <button type="submit">Complete Registration →</button>
        </form>
      `;
      document.getElementById('step2Form').addEventListener('submit', handleStep2Submit);
    }
    else if (currentStep === 3) {
      if (!authenticatedUser) {
        const { data, error } = await supabase.from('users').select('*').eq('email', tempUserData.step1.email);
        if (data && data[0]) authenticatedUser = data[0];
        else { navigateToStep(1); return; }
      }
      container.innerHTML = renderDashboard();
    }
  }

  // Admin Portal Logic
  const adminOverlay = document.getElementById('adminOverlay');
  document.getElementById('adminToggleBtn').onclick = () => adminOverlay.classList.add('active');
  document.getElementById('closeAdminBtn').onclick = () => {
    adminOverlay.classList.remove('active');
    document.getElementById('adminLoginForm').style.display = 'block';
    document.getElementById('adminPanel').style.display = 'none';
  };
  document.getElementById('adminLoginBtn').onclick = async () => {
    const id = document.getElementById('adminId').value;
    const pwd = document.getElementById('adminPassword').value;
    if (id === ADMIN_CREDENTIALS.id && pwd === ADMIN_CREDENTIALS.password) {
      isAdminMode = true;
      document.getElementById('adminLoginForm').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      await loadAdminUsers();
    } else {
      alert('Invalid admin credentials');
    }
  };
  document.getElementById('adminLogoutBtn').onclick = () => {
    isAdminMode = false;
    document.getElementById('adminLoginForm').style.display = 'block';
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('adminId').value = '';
    document.getElementById('adminPassword').value = '';
    adminOverlay.classList.remove('active');
  };

  // Init
  loadTempState();
  renderCurrentStep();
</script>

<!-- RPC Helper: run in Supabase SQL -->
<!--
CREATE OR REPLACE FUNCTION set_admin_context(admin_id text)
RETURNS void AS $$
BEGIN
  PERFORM set_config('app.current_admin', admin_id, false);
END;
$$ LANGUAGE plpgsql;
-->

</body>
</html>
