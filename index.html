<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>1TRUST BANK | Elite Digital Vault</title>
  <!-- Google Fonts: Geometric Sans-Serif -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 (free icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background: url('https://images.pexels.com/photos/2163211/pexels-photo-2163211.jpeg?auto=compress&cs=tinysrgb&w=1600') center/cover no-repeat fixed;
      background-size: cover;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* Dark cinematic overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7); /* brightness(0.3) effect */
      backdrop-filter: blur(2px);
      z-index: 0;
    }

    /* main glassmorphic container */
    .glass-card {
      position: relative;
      z-index: 2;
      max-width: 600px;
      width: 100%;
      background: rgba(20, 25, 35, 0.55);
      backdrop-filter: blur(14px);
      border-radius: 2.5rem;
      border: 1px solid rgba(80, 210, 120, 0.4);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(80,210,120,0.2);
      padding: 2rem 1.8rem;
      transition: all 0.3s ease;
    }

    /* tycoon typography */
    .brand {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #FFFFFF 20%, #2ECC71 85%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .tagline {
      text-align: center;
      color: #CFE9DC;
      font-weight: 500;
      font-size: 0.9rem;
      border-bottom: 1px dashed rgba(46, 204, 113, 0.4);
      display: inline-block;
      width: auto;
      margin: 0 auto 1.5rem auto;
      padding-bottom: 0.5rem;
    }

    .value-prop {
      background: rgba(0,0,0,0.4);
      border-left: 4px solid #2ECC71;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      margin-bottom: 2rem;
      text-align: center;
      font-weight: 600;
      color: #eef4ff;
      font-size: 0.9rem;
    }

    /* buttons */
    .btn-group {
      display: flex;
      gap: 1rem;
      margin: 1rem 0;
      flex-wrap: wrap;
    }
    .btn {
      flex: 1;
      padding: 0.9rem 0;
      border-radius: 3rem;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
      border: none;
      background: none;
    }
    .btn-primary-green {
      background: #2ECC71;
      color: #0a1f12;
      box-shadow: 0 5px 12px rgba(46,204,113,0.3);
    }
    .btn-primary-green:hover {
      background: #27ae60;
      transform: scale(0.98);
    }
    .btn-outline {
      border: 1.5px solid #2ECC71;
      background: transparent;
      color: #2ECC71;
      backdrop-filter: blur(4px);
    }
    .btn-outline:hover {
      background: rgba(46,204,113,0.15);
    }
    .back-nav {
      background: rgba(255,255,240,0.1);
      border: none;
      color: #ccc;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      margin-bottom: 1.2rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .back-nav:hover {
      background: rgba(46,204,113,0.2);
      color: white;
    }

    /* forms */
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      color: #ddd;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(10, 15, 25, 0.8);
      border: 1px solid #2c3e2f;
      border-radius: 1.2rem;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #2ECC71;
    }
    .submit-green {
      background: #2ECC71;
      color: #0a1a0e;
      font-weight: bold;
      opacity: 0.6;
      pointer-events: none;
      transition: 0.2s;
    }
    .submit-green.active {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
    }
    .grid-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px,1fr));
      gap: 1rem;
      margin: 1.8rem 0;
    }
    .action-card {
      background: rgba(0,0,0,0.5);
      border-radius: 1.5rem;
      padding: 0.8rem 0.5rem;
      text-align: center;
      color: #d0f0e0;
      font-weight: 600;
      border: 1px solid rgba(46,204,113,0.3);
      cursor: pointer;
      transition: 0.2s;
    }
    .action-card i {
      font-size: 1.8rem;
      display: block;
      margin-bottom: 6px;
      color: #2ECC71;
    }
    .history-item {
      background: rgba(0,0,0,0.4);
      border-radius: 1rem;
      padding: 0.7rem;
      margin-bottom: 0.6rem;
      font-size: 0.8rem;
    }
    .balance-area {
      background: linear-gradient(135deg, #1F2A2A, #0C1717);
      border-radius: 1.8rem;
      padding: 1rem;
      text-align: center;
      margin: 1rem 0;
    }
    .account-number {
      font-family: monospace;
      letter-spacing: 2px;
      background: #00000066;
      display: inline-block;
      padding: 0.2rem 1rem;
      border-radius: 2rem;
    }
    hr {
      border-color: #2c5536;
      margin: 1rem 0;
    }
    .admin-panel {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      z-index: 99;
    }
    .admin-toggle {
      background: #1f2a2a;
      border-radius: 3rem;
      padding: 0.5rem 1.2rem;
      color: #2ECC71;
      border: 1px solid #2ECC71;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.7rem;
    }
    @media (max-width: 550px) {
      .glass-card { padding: 1.5rem; }
    }
  </style>
</head>
<body>

<div class="glass-card" id="appRoot">
  <!-- dynamic views injected here -->
</div>

<!-- Admin floating toggle (hidden until login) -->
<div class="admin-panel" id="adminFloater" style="display: none;">
  <button class="admin-toggle" id="adminToggleBtn"><i class="fas fa-shield-alt"></i> Admin Console</button>
</div>

<script>
  // ---------- GLOBAL STORAGE (localStorage) ----------
  let users = JSON.parse(localStorage.getItem('1trust_users')) || [];     // each user: { id, fullName, email, dob, phone, photoID, country, accountNumber, balance, transactions }
  let sessions = JSON.parse(localStorage.getItem('1trust_session')) || null; // { userId, name, accountNumber }

  // Helper: generate random 10-digit account number
  function generateAccountNumber() {
    return 'TRUST' + Math.floor(1000000000 + Math.random() * 9000000000).toString();
  }

  // helper: save users to LS
  function persistUsers() {
    localStorage.setItem('1trust_users', JSON.stringify(users));
  }

  // helper: update session
  function setSession(user) {
    sessions = { userId: user.id, name: user.fullName, accountNumber: user.accountNumber };
    localStorage.setItem('1trust_session', JSON.stringify(sessions));
  }

  function clearSession() {
    sessions = null;
    localStorage.removeItem('1trust_session');
  }

  function getCurrentUser() {
    if (!sessions) return null;
    return users.find(u => u.id === sessions.userId);
  }

  // add transaction history to user
  function addTransaction(userId, type, details, amount, reference = null) {
    const user = users.find(u => u.id === userId);
    if (!user) return;
    const historyItem = {
      id: Date.now(),
      type, // "Send", "Receive", "Bill", "International", "Admin"
      details,
      amount: amount || 0,
      timestamp: new Date().toLocaleString(),
      reference: reference || `REF${Math.floor(Math.random()*10000)}`
    };
    if (!user.transactions) user.transactions = [];
    user.transactions.unshift(historyItem);
    persistUsers();
  }

  // ------ RENDER ENGINE ------
  let currentView = 'landing'; // landing, signupForm, countrySelect, clientDashboard, adminDashboard, sendMoney, receiveMoney, payBills, internationalTransfer

  let signupTempData = { country: '' };

  const appRoot = document.getElementById('appRoot');

  // navigation back function
  function navigateBack() {
    const user = getCurrentUser();
    if (currentView === 'clientDashboard') return; // no back needed
    if (currentView === 'landing') return;
    if (currentView === 'signupForm') { currentView = 'countrySelect'; render(); return; }
    if (currentView === 'countrySelect') { currentView = 'landing'; render(); return; }
    if (currentView === 'sendMoney' || currentView === 'receiveMoney' || currentView === 'payBills' || currentView === 'internationalTransfer') {
      currentView = 'clientDashboard';
      render();
      return;
    }
    if (currentView === 'adminDashboard') {
      // if admin logged in, maybe back to landing? but we can close admin panel to client view if client session exists
      if (getCurrentUser()) {
        currentView = 'clientDashboard';
      } else {
        currentView = 'landing';
      }
      render();
      return;
    }
    currentView = 'landing';
    render();
  }

  // country list A-Z
  const allCountries = [
    "Afghanistan", "Albania", "Algeria", "Andorra", "Angola", "Antigua and Barbuda", "Argentina", "Armenia", "Australia", "Austria", "Azerbaijan",
    "Bahamas", "Bahrain", "Bangladesh", "Barbados", "Belarus", "Belgium", "Belize", "Benin", "Bhutan", "Bolivia", "Bosnia and Herzegovina", "Botswana", "Brazil", "Brunei", "Bulgaria", "Burkina Faso", "Burundi",
    "Cabo Verde", "Cambodia", "Cameroon", "Canada", "Central African Republic", "Chad", "Chile", "China", "Colombia", "Comoros", "Congo", "Costa Rica", "Croatia", "Cuba", "Cyprus", "Czech Republic",
    "Denmark", "Djibouti", "Dominica", "Dominican Republic", "Ecuador", "Egypt", "El Salvador", "Equatorial Guinea", "Eritrea", "Estonia", "Eswatini", "Ethiopia",
    "Fiji", "Finland", "France", "Gabon", "Gambia", "Georgia", "Germany", "Ghana", "Greece", "Grenada", "Guatemala", "Guinea", "Guinea-Bissau", "Guyana",
    "Haiti", "Honduras", "Hungary", "Iceland", "India", "Indonesia", "Iran", "Iraq", "Ireland", "Israel", "Italy", "Jamaica", "Japan", "Jordan", "Kazakhstan", "Kenya", "Kiribati", "Korea North", "Korea South", "Kosovo", "Kuwait", "Kyrgyzstan",
    "Laos", "Latvia", "Lebanon", "Lesotho", "Liberia", "Libya", "Liechtenstein", "Lithuania", "Luxembourg", "Madagascar", "Malawi", "Malaysia", "Maldives", "Mali", "Malta", "Marshall Islands", "Mauritania", "Mauritius", "Mexico", "Micronesia", "Moldova", "Monaco", "Mongolia", "Montenegro", "Morocco", "Mozambique", "Myanmar",
    "Namibia", "Nauru", "Nepal", "Netherlands", "New Zealand", "Nicaragua", "Niger", "Nigeria", "North Macedonia", "Norway", "Oman", "Pakistan", "Palau", "Palestine", "Panama", "Papua New Guinea", "Paraguay", "Peru", "Philippines", "Poland", "Portugal", "Qatar", "Romania", "Russia", "Rwanda", "Saint Kitts and Nevis", "Saint Lucia", "Saint Vincent", "Samoa", "San Marino", "Sao Tome", "Saudi Arabia", "Senegal", "Serbia", "Seychelles", "Sierra Leone", "Singapore", "Slovakia", "Slovenia", "Solomon Islands", "Somalia", "South Africa", "South Sudan", "Spain", "Sri Lanka", "Sudan", "Suriname", "Sweden", "Switzerland", "Syria",
    "Taiwan", "Tajikistan", "Tanzania", "Thailand", "Timor-Leste", "Togo", "Tonga", "Trinidad and Tobago", "Tunisia", "Turkey", "Turkmenistan", "Tuvalu", "Uganda", "Ukraine", "United Arab Emirates", "United Kingdom", "United States", "Uruguay", "Uzbekistan", "Vanuatu", "Vatican City", "Venezuela", "Vietnam", "Yemen", "Zambia", "Zimbabwe"
  ];

  function render() {
    if (currentView === 'landing') renderLanding();
    else if (currentView === 'countrySelect') renderCountrySelect();
    else if (currentView === 'signupForm') renderSignupForm();
    else if (currentView === 'clientDashboard') renderClientDashboard();
    else if (currentView === 'adminDashboard') renderAdminDashboard();
    else if (currentView === 'sendMoney') renderSendMoney();
    else if (currentView === 'receiveMoney') renderReceiveMoney();
    else if (currentView === 'payBills') renderPayBills();
    else if (currentView === 'internationalTransfer') renderInternationalTransfer();
  }

  function renderLanding() {
    appRoot.innerHTML = `
      <div style="text-align:center">
        <div class="brand">1TRUST BANK</div>
        <div style="text-align:center"><span class="tagline">Elite Digital Vault · Global Access</span></div>
        <div class="value-prop"><i class="fas fa-globe-americas"></i> Instant跨境 transfers · 24/7 private banking</div>
        <div class="btn-group">
          <button id="createAccBtn" class="btn btn-primary-green"><i class="fas fa-chart-line"></i> Create Account</button>
          <button id="loginBtn" class="btn btn-outline"><i class="fas fa-key"></i> Login</button>
        </div>
        <div style="margin-top: 1rem; font-size: 0.7rem; color:#8FBC8F;">✦ The Growth Path · The Access Key ✦</div>
      </div>
    `;
    document.getElementById('createAccBtn')?.addEventListener('click', () => { currentView = 'countrySelect'; render(); });
    document.getElementById('loginBtn')?.addEventListener('click', () => {
      const phone = prompt("Enter phone number (registered) to login:");
      if(phone) {
        const user = users.find(u => u.phone === phone);
        if(user) { setSession(user); currentView = 'clientDashboard'; render(); }
        else alert("No account found with that phone number. Please create account.");
      }
    });
  }

  function renderCountrySelect() {
    appRoot.innerHTML = `
      <button class="back-nav" id="backNavBtn"><i class="fas fa-arrow-left"></i> Back</button>
      <h3 style="color:white;">Select your country of residence</h3>
      <div class="form-group">
        <label>Country</label>
        <select id="countrySelect">${allCountries.map(c => `<option value="${c}">${c}</option>`).join('')}</select>
      </div>
      <button id="proceedSignup" class="btn btn-primary-green">Continue →</button>
    `;
    document.getElementById('backNavBtn')?.addEventListener('click', navigateBack);
    document.getElementById('proceedSignup')?.addEventListener('click', () => {
      const country = document.getElementById('countrySelect').value;
      signupTempData.country = country;
      currentView = 'signupForm';
      render();
    });
  }

  function renderSignupForm() {
    appRoot.innerHTML = `
      <button class="back-nav" id="backNavBtn"><i class="fas fa-arrow-left"></i> Back</button>
      <h3 style="color:white;">Complete elite onboarding</h3>
      <div class="form-group"><label>Full Name</label><input id="fullName" placeholder="James Vanderbilt"></div>
      <div class="form-group"><label>Email</label><input id="email" type="email" placeholder="james@tycoon.com"></div>
      <div class="form-group"><label>Date of Birth</label><input id="dob" type="date"></div>
      <div class="form-group"><label>Phone Number</label><input id="phone" placeholder="+1234567890"></div>
      <div class="form-group"><label>Photo ID (any text)</label><input id="photoId" placeholder="Passport / DL number"></div>
      <button id="submitSignup" class="btn submit-green" disabled>Submit</button>
    `;
    const inputs = ['fullName','email','dob','phone','photoId'];
    const checkFields = () => {
      const allFilled = inputs.every(id => document.getElementById(id)?.value.trim() !== '');
      const btn = document.getElementById('submitSignup');
      if(allFilled) { btn.classList.add('active'); btn.disabled = false; } 
      else { btn.classList.remove('active'); btn.disabled = true; }
    };
    inputs.forEach(id => document.getElementById(id)?.addEventListener('input', checkFields));
    document.getElementById('backNavBtn')?.addEventListener('click', navigateBack);
    document.getElementById('submitSignup')?.addEventListener('click', () => {
      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const dob = document.getElementById('dob').value;
      const phone = document.getElementById('phone').value;
      const photoID = document.getElementById('photoId').value;
      if(!fullName || !email || !dob || !phone || !photoID) return;
      const newUser = {
        id: Date.now(),
        fullName, email, dob, phone, photoID,
        country: signupTempData.country,
        accountNumber: generateAccountNumber(),
        balance: 0,
        transactions: []
      };
      users.push(newUser);
      persistUsers();
      setSession(newUser);
      currentView = 'clientDashboard';
      render();
    });
    checkFields();
  }

  function renderClientDashboard() {
    const user = getCurrentUser();
    if(!user) { currentView = 'landing'; render(); return; }
    appRoot.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items:center">
        <h2 style="color:white;">Welcome, ${user.fullName.split(' ')[0]}</h2>
        <button id="logoutBtn" style="background:none; border:1px solid #aaa; border-radius:2rem; color:#ccc; padding:0.3rem 1rem;">Exit</button>
      </div>
      <div class="balance-area">
        <div style="font-size:0.7rem;">Current Balance</div>
        <div style="font-size:2rem; font-weight:800;">$${user.balance.toFixed(2)}</div>
        <div class="account-number"><i class="fas fa-credit-card"></i> ${user.accountNumber}</div>
      </div>
      <div class="grid-buttons">
        <div class="action-card" id="sendMoneyBtn"><i class="fas fa-paper-plane"></i> Send Money</div>
        <div class="action-card" id="receiveMoneyBtn"><i class="fas fa-download"></i> Receive Money</div>
        <div class="action-card" id="internationalBtn"><i class="fas fa-globe"></i> Send Abroad</div>
        <div class="action-card" id="payBillsBtn"><i class="fas fa-file-invoice-dollar"></i> Pay Bills</div>
      </div>
      <hr />
      <div style="font-weight:600; color:#2ECC71;">Recent Activity</div>
      <div id="historyList"></div>
    `;
    const historyDiv = document.getElementById('historyList');
    if(user.transactions && user.transactions.length>0){
      user.transactions.slice(0,5).forEach(tx => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `<strong>${tx.type}</strong> ${tx.details} <span style="float:right">${tx.amount ? `$${tx.amount}` : ''}</span><br/><small>${tx.timestamp} | ref:${tx.reference}</small>`;
        historyDiv.appendChild(div);
      });
    } else { historyDiv.innerHTML = '<div class="history-item">✨ Zero history — start your first transaction ✨</div>'; }
    document.getElementById('sendMoneyBtn')?.addEventListener('click',()=>{currentView='sendMoney';render();});
    document.getElementById('receiveMoneyBtn')?.addEventListener('click',()=>{currentView='receiveMoney';render();});
    document.getElementById('internationalBtn')?.addEventListener('click',()=>{currentView='internationalTransfer';render();});
    document.getElementById('payBillsBtn')?.addEventListener('click',()=>{currentView='payBills';render();});
    document.getElementById('logoutBtn')?.addEventListener('click',()=>{clearSession();currentView='landing';render();});
  }

  function renderSendMoney() {
    appRoot.innerHTML = `<button class="back-nav" id="backNav"><i class="fas fa-arrow-left"></i> Back</button>
      <h3>Send Money (Domestic)</h3>
      <div class="form-group"><label>Account Number</label><input id="accNumber" placeholder="TRUST1234567890"></div>
      <div class="form-group"><label>Bank Name</label><input id="bankName" placeholder="1TRUST Bank"></div>
      <div class="form-group"><label>Receiver Name</label><input id="receiverName" placeholder="Full name"></div>
      <div class="form-group"><label>Amount (USD)</label><input id="amountSend" type="number"></div>
      <button id="confirmTransferBtn" class="btn submit-green" disabled>Confirm Transfer</button>
    `;
    function checkSend() { const all = ['accNumber','bankName','receiverName','amountSend'].every(id => document.getElementById(id)?.value.trim() !== ''); const btn = document.getElementById('confirmTransferBtn'); if(all){ btn.classList.add('active'); btn.disabled=false;} else {btn.classList.remove('active'); btn.disabled=true;} }
    ['accNumber','bankName','receiverName','amountSend'].forEach(id => document.getElementById(id)?.addEventListener('input', checkSend));
    document.getElementById('confirmTransferBtn')?.addEventListener('click', () => {
      alert("Your transaction requires account activation. Contact support for activation services.");
      const user = getCurrentUser();
      if(user) addTransaction(user.id, "Send", `To ${document.getElementById('receiverName').value} (pending activation)`, document.getElementById('amountSend').value);
      navigateBack();
    });
    document.getElementById('backNav')?.addEventListener('click', navigateBack);
    checkSend();
  }

  function renderReceiveMoney() {
    const user = getCurrentUser();
    appRoot.innerHTML = `<button class="back-nav" id="backNav"><i class="fas fa-arrow-left"></i> Back</button>
      <div class="balance-area"><div><i class="fas fa-qrcode"></i> Your receiving details</div>
      <div style="font-weight:bold;">${user?.fullName}</div>
      <div class="account-number">${user?.accountNumber}</div>
      <div>Bank: 1TRUST BANK | SWIFT: TRUSGBNK</div>
      </div><p style="color:#aaa;">Share this info to receive funds.</p>`;
    document.getElementById('backNav')?.addEventListener('click', navigateBack);
  }

  function renderPayBills() {
    appRoot.innerHTML = `<button class="back-nav" id="backNav"><i class="fas fa-arrow-left"></i> Back</button>
      <div class="value-prop"><i class="fas fa-credit-card"></i> Apply for 1TRUST Black Card</div>
      <button id="applyCardBtn" class="btn btn-primary-green">Request Elite Card</button>`;
    document.getElementById('applyCardBtn')?.addEventListener('click',()=>{alert("Your black card application has been received. Our concierge will contact you."); navigateBack();});
    document.getElementById('backNav')?.addEventListener('click', navigateBack);
  }

  function renderInternationalTransfer() {
    appRoot.innerHTML = `<button class="back-nav" id="backNav"><i class="fas fa-arrow-left"></i> Back</button>
      <h3>International Transfer</h3>
      <div class="form-group"><label>Destination Country</label><select id="countrySel">${allCountries.map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="form-group"><label>Account Number</label><input id="intAcc" placeholder="IBAN/Account"></div>
      <div class="form-group"><label>Bank Name</label><input id="intBank" placeholder="Beneficiary Bank"></div>
      <div class="form-group"><label>Receiver Name</label><input id="intReceiver"></div>
      <button id="confirmInt" class="btn submit-green active" style="opacity:1;">Submit Transfer</button>`;
    document.getElementById('confirmInt')?.addEventListener('click',()=>{ alert("International transfer request noted. Please contact support for activation."); navigateBack(); });
    document.getElementById('backNav')?.addEventListener('click', navigateBack);
  }

  // ---------- ADMIN CONTROLS (userID:08059422423 / pwd same) ----------
  let adminLogged = false;
  function renderAdminDashboard() {
    if(!adminLogged) { adminLogged = false; currentView = 'landing'; render(); return; }
    appRoot.innerHTML = `<button class="back-nav" id="adminBack"><i class="fas fa-arrow-left"></i> Exit Admin</button>
      <h3 style="color:#2ECC71;">👑 Admin Control</h3>
      <div id="adminUsersList"></div><div id="adminActionArea"></div>`;
    const userListDiv = document.getElementById('adminUsersList');
    userListDiv.innerHTML = users.map(u => `<div style="background:#111d1d; margin:0.5rem 0; padding:0.8rem; border-radius:1rem;"><strong>${u.fullName}</strong> | ${u.accountNumber} | Balance: $${u.balance}<br/>
    <button data-id="${u.id}" class="selectUserAdmin">Select</button></div>`).join('');
    document.querySelectorAll('.selectUserAdmin').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const userId = parseInt(btn.dataset.id);
        const user = users.find(u=>u.id === userId);
        const actionDiv = document.getElementById('adminActionArea');
        actionDiv.innerHTML = `<h4>Modify: ${user.fullName}</h4>
        <input id="adminAmount" type="number" placeholder="Amount (+/-)">
        <input id="adminRef" placeholder="Transaction Reference"><button id="applyBalance" class="btn btn-primary-green">Add/Subtract Balance</button>
        <div id="adminMsg"></div>`;
        document.getElementById('applyBalance')?.addEventListener('click',()=>{
          let amount = parseFloat(document.getElementById('adminAmount').value);
          const ref = document.getElementById('adminRef').value || "Admin op";
          if(isNaN(amount)) return;
          user.balance += amount;
          addTransaction(user.id, "Admin", `Balance adjustment: ${amount>0? 'credit':'debit'}`, amount, ref);
          persistUsers();
          document.getElementById('adminMsg').innerHTML = `<span style="color:green;">Balance updated. New: $${user.balance}</span>`;
          renderAdminDashboard(); 
        });
      });
    });
    document.getElementById('adminBack')?.addEventListener('click',()=>{ adminLogged=false; if(getCurrentUser()) currentView='clientDashboard'; else currentView='landing'; render(); });
  }

  // admin login logic
  document.getElementById('adminFloater')?.addEventListener('click', ()=>{ 
    if(!adminLogged){
      const uid = prompt("Admin User ID (08059422423)");
      const pwd = prompt("Password");
      if(uid === '08059422423' && pwd === '08059422423'){ adminLogged=true; currentView='adminDashboard'; render(); }
      else alert("Invalid admin credentials");
    } else { adminLogged=false; if(getCurrentUser()) currentView='clientDashboard'; else currentView='landing'; render();}
  });

  // session restore & initial render, admin toggle visibility
  function init() {
    if(sessions && getCurrentUser()) currentView = 'clientDashboard';
    else currentView = 'landing';
    render();
    setInterval(()=>{
      const adminDiv = document.getElementById('adminFloater');
      if(adminDiv) adminDiv.style.display = 'block';
    },100);
  }
  init();
</script>
</body>
</html>
